<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>The Over-Giving Check&trade; &middot; Self-Loyalty Lab&trade;</title>
<meta name="description" content="A free two-minute check. Find out which shape your over-giving takes, and which guide is actually the one for you." />

<!-- Not indexed. This page exists to send her onward, and a thin redirect page
     ranking above the real pages would help nobody. -->
<meta name="robots" content="noindex, follow" />

<!-- The redirect itself. Kept as a meta refresh as well as the script below,
     so it still works for anyone whose browser blocks JavaScript. -->
<meta http-equiv="refresh" content="0; url=https://tally.so/r/RGyW4P" />
<link rel="canonical" href="https://tally.so/r/RGyW4P" />

<!-- What shows when this link is pasted into Messenger, Facebook or a DM,
     which is how most of this audience will actually meet it. Without these
     the preview is blank and the link looks unsafe. -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://annalchemy.org/check" />
<meta property="og:title" content="The Over-Giving Check&trade;" />
<meta property="og:description" content="Two minutes. Find out which shape your over-giving takes, and which guide is actually the one for you." />
<meta property="og:image" content="https://annalchemy.org/img/sll-logo.png" />
<meta name="twitter:card" content="summary" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#15110d; --text:#f4ede4; --muted:#b6a899;
    --gold:#d6ab7c; --btn:#f6efe7; --btn-text:#2a1d12;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;line-height:1.55;color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
      radial-gradient(60% 40% at 50% -5%, rgba(214,171,124,.10), transparent 70%),
      var(--bg);
    display:flex;align-items:center;justify-content:center;
    padding:32px 20px;text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:420px}
  .kicker{
    font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--gold);font-weight:700;margin:0 0 10px;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;font-size:1.4rem;font-weight:700;
    margin:0 0 10px;color:#fff;
  }
  p{font-size:.92rem;color:var(--muted);margin:0 0 22px;text-wrap:pretty}
  a.go{
    display:inline-block;background:var(--btn);color:var(--btn-text);
    font-weight:700;font-size:.95rem;text-decoration:none;
    padding:13px 24px;border-radius:14px;
  }
  .dots{
    margin:0 0 20px;color:var(--gold);font-size:20px;letter-spacing:.3em;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){.dots{animation:none;opacity:.6}}
</style>
</head>
<body>
  <main class="wrap">
    <p class="kicker">Self-Loyalty Lab&trade;</p>
    <div class="dots">&middot;&middot;&middot;</div>
    <h1>Taking you to The Over-Giving Check&trade;</h1>
    <p>Two minutes. If nothing happens in a moment, tap below.</p>
    <a class="go" href="https://tally.so/r/RGyW4P">Open the check &rarr;</a>
  </main>

<script>
  // replace() rather than href, so the Back button returns her to wherever she
  // came from instead of landing on this page and bouncing her forward again.
  window.location.replace("https://tally.so/r/RGyW4P");
</script>
</body>
</html>
