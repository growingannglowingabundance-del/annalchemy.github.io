<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 2AM Card&trade; has moved</title>

<!-- Tells search engines the new page is the real one, so the old URL does not
     compete with it and any ranking it earned transfers across. -->
<link rel="canonical" href="https://annalchemy.org/self-loyalty-lab/2am/">

<!-- The redirect itself. Zero seconds, so nobody at 2am waits for a page that
     is only there to point at another page. -->
<meta http-equiv="refresh" content="0; url=/self-loyalty-lab/2am/">

<meta name="robots" content="noindex, follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cellipse cx='50' cy='46' rx='34' ry='42' fill='none' stroke='%235E2A53' stroke-width='6'/%3E%3Cpath d='M36 62 V38 L44 47 L50 32 L56 47 L64 38 V62 Z' fill='%235E2A53'/%3E%3C/svg%3E">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FBF7F0;
    color: #2E1A2A;
    font-family: Georgia, serif;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 34rem; }
  h1 { font-size: 1.6rem; font-weight: 500; line-height: 1.3; margin: 0 0 12px; }
  p { font-size: 1.05rem; line-height: 1.6; margin: 0 0 20px; }
  a.go {
    display: inline-block;
    background: #5E2A53;
    color: #FBF7F0;
    font-family: Arial, sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 15px 26px;
  }
  a.go:hover { background: #171417; }
  .small { font-size: 0.9rem; color: #6E5C68; }
</style>
</head>
<body>
  <div class="box">
    <h1>Your 2AM Card has a new home.</h1>
    <p>Taking you there now.</p>
    <!-- The link matters. A meta refresh can be blocked, and a woman who
         opened this at 2am must never hit a dead end. -->
    <p><a class="go" href="/self-loyalty-lab/2am/">Open the 2AM Card</a></p>
    <p class="small">annalchemy.org/self-loyalty-lab/2am</p>
  </div>
  <script>
    // Faster than the meta refresh where scripting is on, and replace() keeps
    // the old URL out of history so Back does not bounce her between the two.
    location.replace("/self-loyalty-lab/2am/");
  </script>
</body>
</html>
